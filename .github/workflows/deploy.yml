name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un seul déploiement à la fois.
#
# Sans ce garde-fou, trois poussées rapprochées lançaient trois déploiements
# concurrents sur les mêmes dossiers. Chacun fait « mv pouletafc pouletafc_old »
# puis extrait dans « pouletafc » : le second déplaçait le dossier sous les pieds
# du premier, en pleine extraction, et tar échouait sur chaque chemin avec
# « Cannot mkdir: No such file or directory ». Le site restait alors sur une
# release incomplète.
#
# cancel-in-progress est volontairement à false : interrompre un déploiement au
# milieu de la bascule des fichiers est précisément ce qu'on cherche à éviter.
# Les exécutions s'enchaînent donc, la dernière poussée étant appliquée en
# dernier — ce qui est l'ordre voulu.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 209.16.158.105
  DEPLOY_PORT: 5022
  DEPLOY_USER: mnnvvrcp
  DEPLOY_PATH: /home/mnnvvrcp/pouletafc
  BACKUP_PATH: /home/mnnvvrcp/pouletafc_old
  # public_html n'est pas un symlink vers pouletafc/public sur ce serveur : c'est une copie
  # séparée servie directement par le webserver, il faut donc la resynchroniser à chaque déploiement.
  WEBROOT_PATH: /home/mnnvvrcp/public_html
  ARCHIVE_NAME: release-${{ github.sha }}.tar.gz

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      # Dépendances déjà installées, réutilisées telles quelles.
      #
      # C'est la parade décisive : quand composer.lock n'a pas changé — le cas de
      # presque tous les déploiements — « vendor » est restauré et Composer n'a
      # plus rien à télécharger. Les 429 de codeload deviennent alors sans objet.
      - name: Cache des dependances installees
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-php83-${{ hashFiles('composer.lock') }}

      # Cache des archives, pour le jour où composer.lock change : seuls les
      # paquets réellement nouveaux sont alors téléchargés.
      - name: Cache des archives Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: archives-${{ hashFiles('composer.lock') }}
          restore-keys: archives-

      - name: Install PHP dependencies
        env:
          # Requêtes authentifiées : le quota anonyme de codeload est vite
          # atteint, celui d'un jeton ne l'est pas. GitHub le fournit à chaque
          # exécution, il n'y a rien à configurer.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        # « --prefer-install=auto » remplace « --prefer-dist » : ce dernier
        # interdisait à Composer de se rabattre sur le clone Git quand l'archive
        # était refusée — le journal le disait mot pour mot, « Source fallback is
        # disabled ». Git passe par un autre point d'entrée que codeload, et
        # n'est donc pas limité en même temps que lui.
        #
        # Trois tentatives espacées en dernier recours : une limitation de débit
        # se dissipe d'elle-même, et relancer tout le déploiement à la main pour
        # cela coûte plus cher que d'attendre.
        run: |
          for tentative in 1 2 3; do
            if composer install --no-dev --optimize-autoloader --no-interaction --prefer-install=auto; then
              exit 0
            fi

            echo "Tentative $tentative en echec — nouvel essai dans 30 s." >&2
            sleep 30
          done

          echo "Composer a echoue apres trois tentatives." >&2
          exit 1

      - name: Prepare local env for build (needed by artisan/wayfinder during vite build)
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p database
          touch database/database.sqlite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Package release archive
        run: |
          # L'archive doit être écrite hors de "." : sinon tar détecte que le dossier
          # source change pendant qu'il le lit (le fichier archive apparaît/grossit).
          # Ce qui suit ne part pas, et chaque exclusion a sa raison :
          #
          #  - public/upload : 76 Mo d'images envoyées depuis le back-office et
          #    l'application. Elles vivent sur le serveur, où l'étape 5 bis les
          #    restaure depuis la sauvegarde ; les transporter à chaque
          #    déploiement était le premier poste de l'envoi, sans rien apporter.
          #    Elles restent versionnées, donc récupérables si le serveur les perd.
          #
          #  - template : 27 Mo de maquettes HTML d'un thème acheté
          #    (agent_add.html, boutique_list.html…). Aucune vue, aucune route,
          #    aucun contrôleur ne les référence — les seules occurrences de
          #    « template/ » dans le code sont des commentaires laissés par
          #    l'outil qui a aspiré le thème.
          #
          #  - le dump SQL et les logs : 5,7 Mo qui n'ont rien à faire dans une
          #    release.
          tar -czf "/tmp/${{ env.ARCHIVE_NAME }}" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='database/database.sqlite' \
            --exclude='public/upload' \
            --exclude='template' \
            --exclude='*.sql' \
            --exclude='storage/logs/*.log' \
            --exclude='.phpunit.result.cache' \
            .
          mv "/tmp/${{ env.ARCHIVE_NAME }}" "${{ env.ARCHIVE_NAME }}"

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          # Clés d'hôte figées plutôt que relevées à chaud. Un seul ssh-keyscan ouvre
          # cinq connexions TCP, et la boucle de reprise en tentait cinq d'affilée :
          # vingt-cinq connexions en quelques secondes depuis une IP jamais vue, soit
          # le motif même que la protection anti-scan de l'hébergeur bloque — après
          # quoi scp et ssh échouaient à leur tour. Ces clés sont publiques, et les
          # épingler vérifie en prime l'identité du serveur.
          {
            echo '[209.16.158.105]:5022 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBIMOm8QHHSXneiyNliJJXnFnnhgMU3c8sJXSO6csfkxKegUvDE0isV5L0xLUspeK8BsJCbxp1nUZcX8RXR9mvgc='
            echo '[209.16.158.105]:5022 ssh-rsa '
            echo '[209.16.158.105]:5022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIrOLR8T7kongCpfUuIneume8pLqSyhnhzr4pykSikXF'
          } >> ~/.ssh/known_hosts

      # scp et ssh appelés directement, sans action tierce.
      #
      # Toute action utilisée doit d'abord être téléchargée depuis
      # codeload.github.com, avant que la moindre étape ne démarre. Ce point
      # d'entrée répond régulièrement 429 ou 503, et l'exécution s'arrête alors
      # à « Prepare all required actions » : quatre déploiements d'affilée sont
      # morts là, sans qu'une seule ligne de build ne tourne.
      #
      # scp et ssh sont déjà sur la machine. Les appeler nous-mêmes retire deux
      # téléchargements du chemin critique, dont celui qui échouait.
      - name: Upload release archive
        env:
          # sshpass lit ce nom précis avec « -e ». Avec « -p », le mot de passe
          # apparaîtrait dans la liste des processus de la machine.
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          # sshpass est présent sur l'image de la machine, mais l'installer
          # coûte quelques secondes le jour où il n'y serait plus — bien moins
          # qu'un déploiement perdu sur un « command not found ».
          command -v sshpass >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }

          # L'archive et le script de mise en production partent ensemble : une
          # seule connexion, et le script est déposé en fichier plutôt que tubé.
          # Tubé, bash le lirait depuis l'entrée standard, et la première
          # commande du script qui lit stdin en avalerait la suite.
          sshpass -e scp -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            "$ARCHIVE_NAME" .github/deploy-release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/"

      - name: Release on server (backup + swap + finalize)
        # Le disque de cet hébergement mutualisé est lent avec beaucoup de petits
        # fichiers (rsync de ~5500 fichiers vers public_html) : 30 min au serveur,
        # 40 à l'étape pour que ce soit le script qui rende la main, pas le couperet.
        timeout-minutes: 40
        env:
          # sshpass lit ce nom précis avec « -e ». Avec « -p », le mot de passe
          # apparaîtrait dans la liste des processus de la machine.
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          # Les variables sont passées en tête de commande : c'est exactement ce
          # que faisait le paramètre « envs » de l'action remplacée.
          #
          # ServerAliveInterval maintient la connexion pendant le rsync vers
          # public_html, qui reste plusieurs minutes sans rien écrire — sans ça
          # le pare-feu de l'hébergeur coupe une session qu'il croit oisive.
          sshpass -e ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' BACKUP_PATH='$BACKUP_PATH' \
             WEBROOT_PATH='$WEBROOT_PATH' ARCHIVE_NAME='$ARCHIVE_NAME' \
             bash \$HOME/deploy-release.sh"
